<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regina Gold | الإدارة</title><link rel="icon" href="0.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/style.css">
<style>.admin{max-width:820px;margin:50px auto}.login{max-width:420px;margin:12vh auto}.box{background:var(--surface);padding:28px;border:1px solid var(--line);border-radius:10px}.box h1{font-family:Georgia,serif;margin-top:0}.hidden{display:none}.hint{background:var(--surface2);border-right:3px solid var(--gold);padding:12px;color:var(--muted);font-size:.88rem;line-height:1.8;margin:14px 0}.status{padding:12px;margin-top:14px;border-radius:5px;display:none}.status.ok{display:block;background:#216e3b33;color:#93dba7}.status.error{display:block;background:#a12f2f33;color:#ffb3ac}</style>
</head><body><main class="container">
<section class="login" id="login"><div class="box"><h1>Regina Gold</h1><p class="notice">تسجيل دخول الإدارة</p><form id="loginForm" class="field"><label>اسم المستخدم</label><input id="user" autocomplete="username" required><label>كلمة المرور</label><input id="pass" type="password" autocomplete="current-password" required><button class="btn" type="submit">دخول</button></form><p class="notice" id="loginError"></p></div></section>
<section class="admin hidden" id="admin"><div class="box"><div class="dialog-head"><div><h1>إضافة صنف جديد</h1><p class="notice">يرفع المنتج وصورته إلى مستودع GitHub ثم يُنشر الموقع تلقائياً.</p></div><a class="btn alt" href="index.html">عرض المتجر</a></div><div class="hint">لن يُحفظ رمز GitHub في الصفحة. أنشئي Fine-grained token بصلاحية Contents: Read and write للمستودع المحدد فقط.</div>
<form id="productForm"><div class="form-grid">
<div class="field"><label>مالك المستودع</label><input id="owner" value="regina-gold-store" required></div><div class="field"><label>اسم المستودع</label><input id="repo" value="regina-gold-store" required></div><div class="field full"><label>GitHub Token</label><input id="token" type="password" required></div>
<div class="field"><label>الفئة</label><select id="category" required><option value="rings">خواتم</option><option value="necklaces">سلاسل</option><option value="bracelets">أساور</option><option value="earrings">أقراط</option><option value="sets">أطقم</option><option value="italian-gold">ذهب إيطالي</option><option value="ingots">سبائك</option><option value="coins">عملات ذهبية</option><option value="pendants">تعليقات</option><option value="watches">ساعات</option></select></div><div class="field"><label>رقم الصنف</label><input id="number" inputmode="numeric" placeholder="مثال: 001" required></div>
<div class="field"><label>اسم القطعة</label><input id="name" required></div><div class="field"><label>العيار</label><select id="carat" required><option>عيار 24</option><option>عيار 22</option><option>عيار 21</option><option>عيار 18</option><option>عيار 14</option><option>عيار 12</option><option>ذهب إيطالي</option></select></div>
<div class="field"><label>السعر بالجنيه</label><input id="price" type="number" min="0" required></div><div class="field"><label>الوزن بالجرام</label><input id="weight" type="number" min="0" step="0.01"></div><div class="field"><label>حالة التوفر</label><select id="availability"><option value="متوفر">متوفر</option><option value="متاح للطلب">متاح للطلب</option><option value="نفد مؤقتاً">نفد مؤقتاً</option></select></div><div class="field"><label>حالة الشحن</label><select id="shipping"><option value="متوفر شحن">متوفر شحن</option><option value="استلام من الفرع">استلام من الفرع</option></select></div>
<div class="field full"><label>وصف القطعة</label><textarea id="description" placeholder="تفاصيل القطعة، اللون، المقاس…"></textarea></div><div class="field full"><label>صورة القطعة</label><input id="image" type="file" accept="image/*" required></div></div><button class="btn" type="submit" style="margin-top:18px">رفع الصنف إلى GitHub</button></form><div class="status" id="status"></div></div></section>
</main><script src="assets/js/admin.js"></script></body></html>
